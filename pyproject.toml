[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jqscore"
version = "0.1.0"
description = "JAX reimplementation of Q-score (github.com/gregdp/mapq)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
maintainers = [
    { name = "Arthur Zalevsky", email = "aozalevsky@gmail.com" }
]
dependencies = [
    "numpy",
    "scipy",
    "jax",
    "gemmi",
]

[project.optional-dependencies]
gpu = ["jax[cuda13]"]
test = ["pytest>=7.0"]

[project.scripts]
jqscore = "jqscore:_cli"
jqscore-cmd = "jqscore.jqscore_cmd:_mapq_cli"
compare-qscores = "jqscore.compare:main"

[project.urls]
Homepage = "https://github.com/arthurb/jqscore"
Repository = "https://github.com/arthurb/jqscore"
Issues = "https://github.com/arthurb/jqscore/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["jqscore*"]
